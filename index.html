<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase Authentication</title>

  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>

  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 12px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #tokenContainer {
      display: none;
      margin-top: 20px;
      text-align: center;
      width: 90%;
    }

    #tokenDisplay {
      max-width: 100%;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 8px;
      background: #f5f5f5;
      font-size: 14px;
      word-break: break-all;
    }

    #copyBtn {
      margin-top: 10px;
    }

    #copyMsg {
      display: none;
      margin-top: 8px;
      color: green;
      font-weight: bold;
    }

    #errorMsg {
      display: none;
      color: red;
      max-width: 90%;
      text-align: center;
    }

    .auth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 280px;
      padding: 12px 18px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .auth-btn:hover {
      opacity: 0.85;
    }

    .google-btn {
      background: white;
      color: #333;
      border: 1px solid #dadce0;
    }

    .apple-btn {
      background: #000;
      color: white;
      border: 1px solid #000;
    }
  </style>
</head>

<body>
  <button id="googleSignInBtn" class="auth-btn google-btn">
    <svg width="20" height="20" viewBox="0 0 48 48">
      <path fill="#EA4335"
        d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
      <path fill="#4285F4"
        d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.9c-.58 2.96-2.26 5.48-4.74 7.18l7.73 6C44.4 37.91 46.98 31.8 46.98 24.55z" />
      <path fill="#FBBC05" d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.19a24 24 0 0 0 0 21.56z" />
      <path fill="#34A853"
        d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
    </svg>
    Continue with Google
  </button>

  <button id="appleSignInBtn" class="auth-btn apple-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path
        d="M16.37 1.43c0 1.14-.42 2.28-1.25 3.13-.83.83-2.2 1.48-3.39 1.38-.15-1.1.43-2.34 1.18-3.16.84-.88 2.3-1.53 3.46-1.35zM20.94 17.03c-.56 1.25-.83 1.8-1.55 2.91-1.01 1.54-2.44 3.46-4.2 3.48-1.56.02-1.96-1.02-4.07-1.01-2.11.01-2.55 1.04-4.11 1.02-1.76-.02-3.11-1.75-4.12-3.29-2.82-4.31-3.12-9.37-1.38-12.07 1.23-1.92 3.18-3.04 5.02-3.04 1.87 0 3.05 1.02 4.6 1.02 1.5 0 2.42-1.02 4.59-1.02 1.64 0 3.38.89 4.61 2.42-4.05 2.22-3.39 8.01.61 9.58z" />
    </svg>
    Continue with Apple
  </button>

  <div id="errorMsg"></div>

  <div id="tokenContainer">
    <div id="tokenDisplay"></div>
    <button id="copyBtn">Copy Full Token</button>
    <div id="copyMsg">Copied!</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: 'AIzaSyAH0YegOcfvhGrSkcTmBiAB8wfW7oEuSco',
      authDomain: 'auth-demo-a4386.firebaseapp.com',
      projectId: 'auth-demo-a4386',
      appId: '1:216685549681:web:4ba2c813f8c9439fc0a3d0',
    };

    // Initialize Firebase only once.
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();

    // Google provider.
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    // Apple provider.
    const appleProvider = new firebase.auth.OAuthProvider('apple.com');
    appleProvider.addScope('email');
    appleProvider.addScope('name');

    const tokenDisplay = document.getElementById('tokenDisplay');
    const tokenContainer = document.getElementById('tokenContainer');
    const copyMsg = document.getElementById('copyMsg');
    const errorMsg = document.getElementById('errorMsg');

    function shortenToken(token) {
      if (token.length <= 30) return token;

      return token.slice(0, 15) + '...' + token.slice(-15);
    }

    function displayToken(token) {
      tokenDisplay.textContent = shortenToken(token);
      tokenDisplay.dataset.fullToken = token;
      tokenContainer.style.display = 'block';
      errorMsg.style.display = 'none';
    }

    function displayError(error) {
      console.error('Authentication error:', error);

      errorMsg.textContent = error.message || 'Authentication failed.';
      errorMsg.style.display = 'block';
    }

    async function signInWithGoogle() {
      try {
        const result = await auth.signInWithPopup(googleProvider);

        if (!result.user) {
          throw new Error('Google authentication returned no user.');
        }

        const token = await result.user.getIdToken();

        displayToken(token);

        console.log('Google sign-in successful:', result.user);
      } catch (error) {
        displayError(error);
      }
    }

    async function signInWithApple() {
      try {
        const result = await auth.signInWithPopup(appleProvider);

        if (!result.user) {
          throw new Error('Apple authentication returned no user.');
        }

        const token = await result.user.getIdToken();

        displayToken(token);

        console.log('Apple sign-in successful:', result.user);
      } catch (error) {
        console.error('Apple sign-in error:', error);

        if (error.code === 'auth/popup-closed-by-user') {
          console.log('User closed the authentication popup.');
          return;
        }

        displayError(error);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document
        .getElementById('googleSignInBtn')
        .addEventListener('click', signInWithGoogle);

      document
        .getElementById('appleSignInBtn')
        .addEventListener('click', signInWithApple);

      document
        .getElementById('copyBtn')
        .addEventListener('click', async () => {
          const fullToken = tokenDisplay.dataset.fullToken;

          if (!fullToken) return;

          try {
            await navigator.clipboard.writeText(fullToken);

            copyMsg.style.display = 'block';

            setTimeout(() => {
              copyMsg.style.display = 'none';
            }, 2000);
          } catch (error) {
            displayError(new Error('Unable to copy token. Use HTTPS or localhost.'));
          }
        });

      auth.onAuthStateChanged(async (user) => {
        if (user) {
          try {
            const token = await user.getIdToken();
            displayToken(token);
          } catch (error) {
            displayError(error);
          }
        } else {
          tokenContainer.style.display = 'none';
          tokenDisplay.dataset.fullToken = '';
        }
      });
    });
  </script>
</body>

</html>
